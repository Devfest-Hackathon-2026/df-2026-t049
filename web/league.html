<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時間別リーグ · ReliefRoute Arena</title><link rel="stylesheet" href="/style.css"><script type="module" src="/league.js"></script>
</head>
<body class="league-page"><header class="topbar unified-header"><a class="brand" href="/">ReliefRoute Arena</a><nav class="site-nav" data-i18n-aria-label="navigation"><a href="/" data-i18n="navArena"></a><a href="/league" aria-current="page" data-i18n="navLeague"></a></nav><div class="header-actions"><label class="sr-only" for="language" data-i18n="language"></label><select id="language" class="language-select" data-i18n-aria-label="language"><option value="ja">日本語</option><option value="zh">中文</option><option value="en">English</option></select></div></header><main>
<section class="league-overview"><div><h1 data-copy="title"></h1><p data-copy="intro"></p><p class="journey" data-i18n="leagueGuide"></p></div><div class="round-clock"><p id="league-status" role="status"></p><p id="league-count"></p><button id="refresh" data-copy="refresh"></button></div></section>
<nav class="section-nav" data-i18n-aria-label="navigation"><a href="#deploy-form" data-i18n="navCreate"></a><a href="#ranking-section" data-i18n="navRanking"></a><a href="#recent-round" data-i18n="roundNav"></a><a href="#replay-region" data-i18n="replayNav"></a></nav>
<div class="league-grid"><section class="panel bot-workshop"><h2 data-copy="deploy"></h2><form id="deploy-form">
<label><span data-copy="name"></span><input name="name" required maxlength="40"></label>
<label><span data-copy="botType"></span><select id="bot-type"><option value="strategy" data-copy="strategyType"></option><option value="program" data-copy="programType"></option></select></label>
<div id="program-editor" hidden><p data-copy="programHelp"></p><button type="button" id="load-example" data-copy="example"></button><label><span data-copy="source"></span><textarea id="bot-source" rows="20" wrap="off" spellcheck="false" style="width:100%;font-family:monospace" maxlength="6000"></textarea></label></div>
<label><span data-copy="priority"></span><select name="priority_rule"><option value="urgency" data-copy="urgency"></option><option value="nearest" data-copy="nearest"></option><option value="fair" data-copy="fair"></option></select></label>
<label><span data-copy="load"></span><select name="load_rule"><option value="full" data-copy="full"></option><option value="half" data-copy="half"></option></select></label>
<label><span data-copy="dispatch"></span><select name="dispatch_rule"><option value="any" data-copy="any"></option><option value="full_load" data-copy="full_load"></option></select></label>
<details class="strategy-help"><summary data-i18n="rulesDetails"></summary><p data-copy="rules"></p></details><p data-copy="review"></p><button type="submit" data-copy="deploy"></button></form><p data-copy="starts"></p><p id="deployment" class="notice" role="status"></p>
<details id="bot-management"><summary data-copy="manage"></summary><p data-copy="secret"></p><label>Bot ID<input id="management-id" autocomplete="off"></label><label><span data-copy="token"></span><input id="management-token" type="password" autocomplete="off"></label><button id="copy-token" data-copy="copyToken"></button><button id="pause-bot" data-copy="pauseBot"></button> <button id="resume-bot" data-copy="resumeBot"></button><p id="management-status" role="status"></p></details>
</section><section class="panel league-results-panel" id="ranking-section"><h2 data-copy="ranking"></h2><p data-copy="ratingHelp"></p><div class="table-wrap"><table><thead><tr><th>#</th><th>Bot</th><th data-copy="rating"></th><th data-copy="played"></th><th data-copy="state"></th></tr></thead><tbody id="league-ranking"></tbody></table></div><section id="recent-round"><h2 data-copy="round"></h2><p id="round-info"></p><div class="table-wrap"><table><thead><tr><th>Bot</th><th data-copy="score"></th><th data-copy="delta"></th><th data-copy="watch"></th></tr></thead><tbody id="league-results"></tbody></table></div><p class="muted" data-copy="history"></p></section></section></div>
<section id="replay-region"><div id="replay-empty" class="replay-empty"><h2 data-i18n="replayNav"></h2><p id="replay-empty-message" data-i18n="replayEmpty"></p><a href="#recent-round" class="replay-empty-link" data-i18n="roundNav"></a></div><section class="panel" id="league-replay" hidden><h2 id="replay-name"></h2><p data-copy="recorded"></p><p id="replay-map-info" class="map-info"></p><details class="map-notes"><summary data-i18n="mapNotes"></summary><p data-i18n="stableLayout"></p><p data-i18n="visualOnly"></p></details><div id="league-map-selection" class="map-selection"></div><p id="league-map-incidents" class="map-incidents"></p><div class="map-toolbar"><div class="map-view-switch" role="group" data-i18n-aria-label="mapScale"><button type="button" data-map-view="fit" aria-pressed="true" data-i18n="mapFit"></button><button type="button" data-map-view="detail" aria-pressed="false" data-i18n="mapDetail"></button></div></div><div class="league-map-viewport fit-map"><svg id="league-map" viewBox="0 0 880 500" role="group" data-i18n-aria-label="inspectMap"><g id="roads"></g><g id="nodes"></g><g id="vehicles"></g></svg></div><div class="league-playback"><button id="replay-reset" aria-label="Reset">↺</button><button id="replay-back" aria-label="Previous">←</button><button id="replay-next" aria-label="Next">→</button><select id="replay-speed" aria-label="Speed"><option>0.5</option><option selected>1</option><option>2</option><option>4</option></select><button id="replay-play" data-copy="play"></button><label><span data-copy="turn"></span> <span id="replay-position"></span><input id="replay-turn" type="range" min="0" value="0"></label><p id="replay-state"></p></div><details class="replay-state-details"><summary data-i18n="replayDetails"></summary><div id="replay-details" class="replay-details"></div></details><h3 data-copy="events"></h3><div id="replay-events" class="notice"></div><button id="replay-download" data-copy="download"></button></section>
</section><p class="site-disclaimer" data-copy="simulation"></p></main></body></html>
